services:
  postgres:
    image: postgres:18-alpine
    container_name: nisky-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nisky
    ports:
      - "${NISKY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: nisky-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: nisky_access_key
      MINIO_ROOT_PASSWORD: nisky_secret_key_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: nisky-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set nisky http://minio:9000 nisky_access_key nisky_secret_key_change_me; do
        echo 'Esperando a MinIO...'; sleep 1;
      done;
      mc mb nisky/nisky-bucket || true;
      mc anonymous set download nisky/nisky-bucket;
      exit 0;
      "

  redis:
    image: redis:8-alpine
    container_name: nisky-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
